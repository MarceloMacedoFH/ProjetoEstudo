{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Center Noivas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="premium-card p-12 w-full max-w-md">
        <div class="flex flex-col items-center mb-8">
            <img src="{% static 'images/logo-noiva.png' %}" alt="Logo Center Noivas" class="w-24 h-24 object-cover rounded-full border-2 border-stone-100 shadow-sm mb-5">
            <h1 class="brand-font text-4xl text-stone-800 font-light italic">Center Noivas</h1>
            <p class="text-stone-500 text-sm font-light tracking-wide mt-2">Acesse o sistema</p>
        </div>

        {% if form.non_field_errors %}
        <div class="mb-6 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
            {{ form.non_field_errors.0 }}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label for="{{ form.username.id_for_label }}" class="block text-[12px] uppercase tracking-widest text-stone-600 font-bold mb-2">Usuário</label>
                {{ form.username }}
            </div>

            <div>
                <label for="{{ form.password.id_for_label }}" class="block text-[12px] uppercase tracking-widest text-stone-600 font-bold mb-2">Senha</label>
                {{ form.password }}
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-stone-800 text-white text-sm tracking-widest uppercase font-semibold hover:bg-stone-700 transition-colors">
                Entrar
            </button>
        </form>
    </div>

</body>
</html>
